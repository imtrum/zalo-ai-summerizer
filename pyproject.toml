[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-ai-summarizer"
version = "0.1.0"
description = "A configurable AI summarizer for Zalo conversations"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.29.0",
    "playwright>=1.63.0",
]

[tool.setuptools.packages.find]
where = ["src"]
